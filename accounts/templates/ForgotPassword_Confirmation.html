{% extends 'account_base.html' %}
{% load static %}

{% block title %}JetMyProjects - Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-brand-container">
    <a href="{% url 'index' %}" class="logo" target="_blank"
        style="display: flex; align-items: center; text-decoration: none;">
        <img src="{% static 'ImageLogox.png' %}" alt="JetMyProjects Logo" style="height: 32px;">
        JetMyProjects
    </a>
</div>

<div class="container-fluid p-0">
    <div class="row g-0 vh-100">
        <div class="col-md-6 h-100 d-none d-md-block">
            <div class="image-wrapper text-center">
                <img src="{% static 'ImageForgotPassword.jpg' %}" class="auth-full-image" alt="Confirmation Image">
            </div>
        </div>

        <div class="col-md-6 d-flex align-items-center justify-content-center bg-white h-100">
            <div class="auth-content-container text-start">
                <div class="success-icon fs-1 text-success mb-3"><i class="fas fa-check-circle"></i></div>
                <h1 class="mb-3 auth-title">Forgot Password</h1>
                <h3 class="h5 mb-4 text-muted">Your password has been successfully updated.</h3>

                <div class="d-grid">
                    <a href="/login/" class="btn auth-btn-primary text-center"
                        style="padding: 10px 20px; font-weight: 600; border-radius: 5px; text-decoration: none;">
                        Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
