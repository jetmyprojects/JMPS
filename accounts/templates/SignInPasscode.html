{% extends 'account_base.html' %}
{% load static %}

{% block title %}JetMyProjects - Sign In Passcode{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="auth-brand-container">
        <a href="https://www.jetmyprojects.com/" target="_blank" class="auth-brand-name">
            <img src="{% static 'ImageLogox.png' %}" alt="Logo" class="auth-brand-logo">
            <span>JetMyProjects<sup>&reg;</sup></span>
        </a>
    </div>

    <div class="row g-0 vh-100">
        <div class="col-md-6 d-none d-md-block">
            <img src="{% static 'ImageSignIn.jpg' %}" class="auth-full-image" alt="Sign In Image">
        </div>

        <div class="col-md-6 d-flex align-items-center justify-content-center bg-white">
            <div class="auth-content-container">
                <h1 class="mb-4 text-start auth-title">Sign In</h1>

                <form action="Dashboard_Active.html" id="passcodeForm">
                    <div class="mb-3">
                        <label class="form-label">Enter Passcode for <span id="email-display"
                                class="fw-bold text-dark">your email</span></label>
                        <input type="password" class="form-control" id="passcodeField" name="passcode_signin"
                            placeholder="Enter 6-digit passcode" maxlength="6" required>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="showPasscode">
                        <label class="form-check-label" for="showPasscode">
                            Show Passcode
                        </label>
                    </div>
                    <button type="submit" class="btn auth-btn-primary w-100 mb-3">
                        Submit
                    </button>

                    <div id="countdown-area">
                        <h6 class="text-muted">Resending Passcode in <span id="timer">30</span> seconds</h6>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const passcodeField = document.getElementById('passcodeField');
        const showPasscodeCheckbox = document.getElementById('showPasscode');
        const timerDisplay = document.getElementById('timer');
        const countdownArea = document.getElementById('countdown-area');

        // 0. Set Email Display
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            const emailDisplay = document.getElementById('email-display');
            if (emailDisplay) emailDisplay.textContent = email;
        }

        // Toggle passcode visibility
        if (showPasscodeCheckbox) {
            showPasscodeCheckbox.addEventListener('change', () => {
                passcodeField.type = showPasscodeCheckbox.checked ? 'text' : 'password';
            });
        }

        // Simple Resend Timer Logic
        let secondsLeft = 30;
        const countdown = setInterval(() => {
            secondsLeft--;
            if (timerDisplay) timerDisplay.textContent = secondsLeft;
            if (secondsLeft <= 0) {
                clearInterval(countdown);
                countdownArea.innerHTML = '<a href="#" class="text-decoration-none" style="color: var(--brand-orange); font-weight: 600;">Resend Passcode Now</a>';
            }
        }, 1000);
    });
</script>
{% endblock %}
