{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetmyprojects | Smart Project & Deadline Tracker</title>
    <meta name="description"
        content="Manage projects, track deadlines, and stay productive with jetmyprojects. Simple, fast, cloud-based project management.">

    {% block css_framework %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="{% static 'ImageFaviconx.png' %}">

    <!-- Global CSS -->

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    {% endblock %}

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Toast Notification Container (Can be overridden or removed if page has its own) -->
    {% block toast_container %}
    <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1050"></div>
    {% endblock %}

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>

</html>
