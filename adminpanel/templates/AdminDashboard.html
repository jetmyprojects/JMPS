{% extends 'BaseAdmin.html' %}

{% block page_title %}Dashboard Overview{% endblock %}

{% block content %}
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card admin-card-stat bg-primary text-white p-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-uppercase m-0 opacity-75">Total Users</h6>
                <i class="fas fa-users fa-2x opacity-50"></i>
            </div>
            <h2 class="display-6 fw-bold mb-0" id="userCount">0</h2>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card admin-card-stat bg-success text-white p-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-uppercase m-0 opacity-75">Total Tasks</h6>
                <i class="fas fa-check-circle fa-2x opacity-50"></i>
            </div>
            <h2 class="display-6 fw-bold mb-0" id="taskCount">0</h2>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card admin-card-stat bg-warning text-dark p-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-uppercase m-0 opacity-75">Active Subs</h6>
                <i class="fas fa-credit-card fa-2x opacity-50"></i>
            </div>
            <h2 class="display-6 fw-bold mb-0" id="billingCount">0</h2>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card admin-card-stat bg-info text-white p-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-uppercase m-0 opacity-75">Space Used</h6>
                <i class="fas fa-hdd fa-2x opacity-50"></i>
            </div>
            <h2 class="display-6 fw-bold mb-0" id="spaceUsedCount">0 MB</h2>
        </div>
    </div>
</div>

<div class="row mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="fw-bold m-0 text-secondary">Recent Activity</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h6 class="text-uppercase text-secondary mb-3 small">New Users</h6>
                        <ul class="list-group list-group-flush" id="recentUsersList">
                            <li class="list-group-item text-muted small">Loading...</li>
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-uppercase text-secondary mb-3 small">New Tasks</h6>
                        <ul class="list-group list-group-flush" id="recentTasksList">
                            <li class="list-group-item text-muted small">Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadStats() {
        const token = localStorage.getItem('access_token');
        try {
            const response = await fetch('/api/v1/admin/stats/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const data = await response.json();

                // Update Counts
                document.getElementById('userCount').innerText = data.counts.users;
                document.getElementById('taskCount').innerText = data.counts.tasks;
                document.getElementById('billingCount').innerText = data.counts.subs;
                document.getElementById('spaceUsedCount').innerText = data.counts.space_used;

                // Update Recent Users
                const usersList = document.getElementById('recentUsersList');
                usersList.innerHTML = data.recent_users.length ? data.recent_users.map(u => `
                    <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold small">${u.email}</div>
                            <div class="text-muted" style="font-size: 0.75rem">${new Date(u.date_joined).toLocaleDateString()}</div>
                        </div>
                        <span class="badge ${u.is_active ? 'bg-light text-dark' : 'bg-danger'} rounded-pill small">
                            ${u.is_active ? 'New' : 'Blocked'}
                        </span>
                    </li>
                `).join('') : '<li class="list-group-item text-muted small">No recent users</li>';

                // Update Recent Tasks
                const tasksList = document.getElementById('recentTasksList');
                tasksList.innerHTML = data.recent_tasks.length ? data.recent_tasks.map(t => `
                    <li class="list-group-item px-0">
                        <div class="fw-bold small text-truncate">${t.project_name}</div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <span class="text-muted" style="font-size: 0.75rem">${t.user_email}</span>
                            <span class="badge bg-light text-dark border text-dark rounded-pill" style="font-size: 0.7rem">${t.status}</span>
                        </div>
                    </li>
                `).join('') : '<li class="list-group-item text-muted small">No recent tasks</li>';
            }

        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }
    loadStats();
</script>
{% endblock %}
