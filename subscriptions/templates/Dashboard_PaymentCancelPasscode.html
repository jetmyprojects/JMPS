{% extends 'payment_base.html' %}
{% load static %}

{% block title %}JetMyProjects - Verify Cancellation{% endblock %}

{% block header_title %}Security Check{% endblock %}

{% block content %}
<main class="content-area">
    <div class="text-center mb-4">
        <h2 class="section-title">Security Check</h2>
        <p class="text-muted">Please enter your 6-digit passcode to confirm cancellation.</p>
    </div>

    <div class="info-container">
        <form action="{% url 'dashboard_payment_cancel_confirm' %}" class="text-start">
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">ENTER PASSCODE</label>
                <input type="password" class="form-control form-control-lg" placeholder="******" required maxlength="6"
                    style="letter-spacing: 5px; text-align: center;">
            </div>

            <button type="submit" class="btn btn-brand-orange mb-3">Confirm Cancellation</button>
            <div class="text-center">
                <a href="/#pricing" class="text-decoration-none text-muted small">Go Back</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
