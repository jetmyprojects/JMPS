{% extends 'task_base.html' %}
{% load static %}

{% block title %}JetMyProjects - Project Details{% endblock %}

{% block content %}
<main class="content-area">
    <h2 class="section-title">Project Details</h2>

    <div class="task-detail-row">
        <div class="task-detail-label">Project Name</div>
        <div id="projectName">Loading...</div>
    </div>
    <div class="row">
        <div class="col-md-6 task-detail-row">
            <div class="task-detail-label">Deadline Date</div>
            <div id="deadlineDate">-</div>
        </div>
        <div class="col-md-6 task-detail-row">
            <div class="task-detail-label">Deadline Time</div>
            <div id="deadlineTime">-</div>
        </div>
    </div>
    <div class="task-detail-row">
        <div class="task-detail-label">Status</div>
        <div id="projectStatus">-</div>
    </div>
    <div class="task-detail-row">
        <div class="task-detail-label">Project Notes</div>
        <div id="projectNotes" style="white-space: pre-wrap;">-</div>
    </div>
    <div class="task-detail-row">
        <div class="task-detail-label">Attached Files</div>
        <div id="fileList">-</div>
    </div>

    <div class="d-flex flex-wrap gap-3 mt-4">
        <a href="#" id="editLink" class="btn btn-custom spa-link">Edit Project</a>
        <a href="/projects/tasks/active/" id="backToListBtn" class="btn btn-custom spa-link">Back to List</a>
    </div>
    <script>
        // Use an IIFE or named function to avoid global scope pollution if needed, but simple block is fine here.
        async function initTaskDetails() {
            console.log("Init Task Details for SPA path:", window.location.pathname);

            try {
                const profileRes = await ApiClient.fetch('/api/v1/accounts/user/profile/');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    const greetingName = profileData.first_name || profileData.username || 'User';
                    const greetingEl = document.getElementById('userGreeting');
                    if (greetingEl) {
                        greetingEl.textContent = `Hello, ${greetingName}!`;
                    }
                }
            } catch (e) {
                console.error('Failed to load profile', e);
            }

            const parts = window.location.pathname.split('/');
            const taskId = parts[parts.indexOf('tasks') + 1];

            if (taskId && !isNaN(taskId)) {
                const editLink = document.getElementById('editLink');
                if (editLink) editLink.href = `/projects/tasks/${taskId}/edit/`;

                try {
                    console.log(`Fetching task detail for ID: ${taskId}`);
                    const response = await ApiClient.fetch(`/api/v1/tasks/${taskId}/`);
                    if (response.ok) {
                        const task = await response.json();
                        console.log("Task data received:", task);

                        const updateText = (id, text) => {
                            const el = document.getElementById(id);
                            if (el) el.textContent = text || '-';
                        };

                        updateText('projectName', task.project_name);

                        // Format Date
                        let dateDisplay = '-';
                        if (task.deadline_date) {
                            const [y, m, d] = task.deadline_date.split('-');
                            const dateObj = new Date(y, m - 1, d);
                            dateDisplay = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
                        }
                        updateText('deadlineDate', dateDisplay);

                        // Format Time
                        let timeDisplay = '-';
                        if (task.deadline_time) {
                            const [h, m, s] = task.deadline_time.split(':');
                            const dateObj = new Date();
                            dateObj.setHours(h, m, s);
                            timeDisplay = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                        }
                        updateText('deadlineTime', timeDisplay);

                        let displayStatus = task.status;
                        if (task.status === 'UNCOMPLETED') displayStatus = 'Not Completed';
                        else if (task.status === 'COMPLETED') displayStatus = 'Completed';
                        else if (task.status === 'ACTIVE') displayStatus = 'Active';
                        else if (task.status === 'DRAFT') displayStatus = 'Draft';
                        else if (task.status === 'DELETED') displayStatus = 'Deleted';

                        updateText('projectStatus', displayStatus);
                        updateText('projectNotes', task.project_notes);

                        const fileListDiv = document.getElementById('fileList');
                        if (fileListDiv) {
                            if (task.files && task.files.length > 0) {
                                fileListDiv.innerHTML = '';
                                task.files.forEach(f => {
                                    const link = document.createElement('a');
                                    link.href = f.file;
                                    link.target = '_blank';
                                    link.className = 'd-block text-decoration-none mb-1';
                                    link.innerHTML = `<i class="fas fa-file me-2"></i>${f.file.split('/').pop()}`;
                                    fileListDiv.appendChild(link);
                                });
                            } else {
                                fileListDiv.textContent = 'No files attached.';
                            }
                        }

                        // Update Back Button Link
                        const backBtn = document.getElementById('backToListBtn');
                        if (backBtn) {
                            if (task.status === 'DRAFT') backBtn.href = '/projects/tasks/draft/';
                            else if (task.status === 'COMPLETED') backBtn.href = '/projects/tasks/completed/';
                            else if (task.status === 'UNCOMPLETED') backBtn.href = '/projects/tasks/uncompleted/';
                            else if (task.status === 'DELETED') backBtn.href = '/projects/tasks/deleted/';
                            else backBtn.href = '/projects/tasks/active/';
                        }
                    } else {
                        console.error("API Error:", response.status);
                        document.getElementById('projectName').innerHTML = `<span class="text-danger">Failed to load project (${response.status})</span>`;
                    }
                } catch (e) {
                    console.error("Fetch implementation failed:", e);
                    document.getElementById('projectName').innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
                }
            } else {
                console.warn("No valid taskId found in URL");
            }
        }

        // Initialize
        if (typeof ApiClient !== 'undefined') {
            initTaskDetails();
        } else {
            document.addEventListener('DOMContentLoaded', initTaskDetails);
        }

        // Backup for SPA
        if (!window.detailsListenerAdded) {
            document.addEventListener('app:pageLoaded', (e) => {
                const path = e.detail.path;
                // Only run for detail page, not for list or edit
                const isDetailPath = /\/projects\/tasks\/\d+\/$/.test(path);
                if (isDetailPath && !document.getElementById('taskTableBody')) {
                    initTaskDetails();
                }
            });
            window.detailsListenerAdded = true;
        }
    </script>
</main>
{% endblock %}
