{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetmyprojects | Smart Project & Deadline Tracker</title>
    <meta name="description"
        content="Manage projects, track deadlines, and stay productive with jetmyprojects. Simple, fast, cloud-based project management.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff8c00;
            --primary-orange-dark: #cc7000;
            --dark-text: #1e1919;
            --gray-text: #636363;
            --light-bg: #fdfbf7;
            --white: #ffffff;
            --brand-green: #4EA72E;
        }

        body {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--dark-text);
            line-height: 1.6;
            background-color: var(--white);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page-wrapper {
            background-color: #fff;
            border: 20px solid var(--primary-orange-dark);
            /* Yellow/Gold for 404 */
            padding: 40px;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .error-content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .error-heading {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-orange-dark);
            margin-bottom: 0.5rem;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .error-subheading {
            font-size: 1.5rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-text {
            color: #6c757d;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-error-action {
            background-color: var(--primary-orange-dark);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            text-transform: capitalize;
            border: none;
            transition: all 0.3s ease;
            width: fit-content;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.3);
        }

        .btn-error-action:hover {
            background-color: var(--primary-orange-dark);
            color: white;
            transform: translateY(-2px);
        }

        .dots-decoration {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: var(--primary-orange-dark);
            border-radius: 50%;
        }

        @media (max-width: 991px) {
            .error-page-wrapper {
                border-width: 10px;
                padding: 20px;
            }

            .error-heading {
                font-size: 2.5rem;
            }

            .error-content-left {
                text-align: center;
                align-items: center;
                margin-bottom: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="error-page-wrapper">
        <div class="row align-items-center">
            <!-- Left Side: Text Content -->
            <div class="col-lg-6 error-content-left ps-lg-5">
                <h1 class="error-heading">ERROR 404</h1>
                <h2 class="error-subheading">PAGE NOT FOUND</h2>
                <p class="error-text">
                    Oops! The page you are looking for does not exist. It might have been moved or deleted.
                    Don't worry, you can easily find your way back home.
                </p>

                <a href="/" class="btn-error-action">Go Home</a>

                <div class="dots-decoration">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <!-- Right Side: 404 Video -->
            <div class="col-lg-6 text-center">
                <div class="video-container">
                    <video autoplay loop muted playsinline style="max-width: 100%; height: auto; border-radius: 10px;">
                        <source src="{% static 'video/404_error.mp4' %}" type="video/mp4">

                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
